name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae --fail-fast
        if: github.event_name == 'pull_request'

      - name: Smoke-test the Cast desktop cask
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          appdir="$RUNNER_TEMP/cast-cask-apps"
          brew fetch --cask "$TAP_NAME/cast-desktop"
          brew install --cask --appdir="$appdir" "$TAP_NAME/cast-desktop"
          test -x "$appdir/Cast.app/Contents/MacOS/Cast"
          codesign --verify --deep --strict "$appdir/Cast.app"
          plutil -lint "$appdir/Cast.app/Contents/Info.plist"
          brew uninstall --cask "$TAP_NAME/cast-desktop"

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
